[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LiteSVM/litesvm"
rust-version = "1.89.0"

[workspace.dependencies]
agave-feature-set = "4.3.0"
agave-precompiles = "4.3.0"
agave-reserved-account-keys = "4.3.0"
solana-syscalls = "4.3.0"
ansi_term = "0.12"
bv = "0.11.1"
criterion = "0.8.2"
ed25519-dalek = "2.2.0"
hashbrown = "0.17.1"
hex = "0.4.3"
indexmap = "2.14"
itertools = "0.15"
libsecp256k1 = "0.7.2"
litesvm = { path = "crates/litesvm", version = "0.17" }
litesvm-persistence = { path = "crates/persistence", version = "0.17" }
log = "0.4"
napi = { version = "3.12.2", default-features = false }
napi-build = "2.4.1"
napi-derive = "3.6.3"
nom = "8.0.0"
qualifier_attr = "0.2.2"
serde = "1.0.229"
sha2 = "0.10.9"
smallvec = "1.15"
solana-account = "^4"
solana-address = "^2"
solana-address-lookup-table-interface = "^3"
solana-builtins = "^4"
solana-clock = "^3"
solana-compute-budget = "^4"
solana-compute-budget-instruction = "^4"
solana-compute-budget-interface = "^3"
solana-ed25519-program = "^3"
solana-epoch-rewards = "^3"
solana-epoch-schedule = "^3"
solana-fee = "^4"
solana-feature-gate-interface = "^4"
solana-fee-calculator = "^3"
solana-fee-structure = "4.1.0"
solana-hash = "^4"
solana-instruction = "^3"
solana-instruction-error = "^2"
solana-instructions-sysvar = "4.0.0"
solana-keypair = "^3"
solana-last-restart-slot = "^3"
solana-loader-v3-interface = "^9"
solana-loader-v4-interface = "3.1.0"
solana-message = "^4"
solana-native-token = "3.0.0"
solana-nonce = "^3"
solana-nonce-account = { version = "^4", features = ["bincode"] }
solana-precompile-error = "^3"
solana-program-error = "^3"
solana-program-option = "^3"
solana-program-pack = "^3"
solana-program-runtime = "^4"
solana-rent = "^4"
solana-runtime-transaction = "^4"
solana-sdk-ids = "^3"
solana-secp256k1-program = "^3"
solana-sha256-hasher = "^3"
solana-signature = "^3"
solana-signer = "^3"
solana-slot-hashes = "^3"
solana-slot-history = "^3"
solana-stake-history = "^1"
solana-stake-interface = "^4"
solana-svm-callback = "^4"
solana-svm-log-collector = "^4"
solana-svm-timings = "^4"
solana-svm-transaction = "^5"
solana-system-interface = "^3"
solana-system-program = "^4"
solana-sysvar = "^4"
solana-sysvar-id = "^3"
solana-transaction = "^4"
solana-transaction-context = "^4"
solana-transaction-error = "^3"
solana-vote-interface = "^6"
spl-associated-token-account-interface = "^2"
spl-token-2022-interface = "^3"
spl-token-interface = "^3"
tempfile = "3"
test-log = "0.2"
thiserror = "2.0.20"
wincode = "0.6.1"

[profile.bench]
debug = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.clippy]
result_large_err = "allow"
