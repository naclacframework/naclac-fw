[package]
name = "naclac-litesvm-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js (napi) bindings for naclac's litesvm test provider — an RPC-shaped, SDK-agnostic surface over the same litesvm Rust crate the Rust NaclacProvider already uses, so both @solana/kit- and @solana/web3.js-based clients can share one backend."

[lib]
crate-type = ["cdylib"]

[dependencies]
naclac-client = { workspace = true }
solana-address = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true }
wincode = "=0.5.5"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
