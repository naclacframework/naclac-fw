[package]
name = "naclac-idl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IDL (Interface Definition Language) generation and parsing for Naclac."

[dependencies]
naclac-syn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-system-interface = { workspace = true }
inventory = { workspace = true, optional = true }

[features]
# The registry a program's items submit their IDL fragments to, collected by the
# `idl-build` binary. Off everywhere else, so the CLI and clients link no
# link-section machinery.
idl-build = ["dep:inventory"]

[lints]
workspace = true
