[package]
name = "naclac-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Naclac Framework Rust Client & Testing Runtime Library"

[dependencies]
naclac-core = { workspace = true, features = ["solana"] }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-instruction = "=3.4.0"
solana-address = { workspace = true, features = ["curve25519"] }
solana-signature = { workspace = true }
solana-system-interface = "=3.2.0"
solana-program = { workspace = true }
litesvm = { workspace = true }
solana-transaction-context = { workspace = true }
wincode = "=0.5.5"
solana-reward-info = "=6.2.0"
borsh = { workspace = true, default-features = false, features = ["derive"] }
bytemuck = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
solana-account = { workspace = true, features = ["bincode"] }
solana-transaction-status = { workspace = true, features = ["agave-unstable-api"] }
solana-commitment-config = { workspace = true }
solana-message = { workspace = true }
bs58 = { workspace = true }
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }
spl-associated-token-account = { workspace = true }
solana-account-decoder = { workspace = true, features = ["agave-unstable-api"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# Pinned to exactly what litesvm 0.15.2 itself depends on, to avoid pulling
# in a third, independently-drifting version of either crate.
solana-loader-v3-interface = { version = "=8.0.1", features = ["serde"] }
solana-sdk-ids = "=3.1.0"

[lints]
workspace = true
