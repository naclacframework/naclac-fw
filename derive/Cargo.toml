[package]
name = "naclac-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for the Naclac Solana Framework"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "visit", "visit-mut"] }
sha2 = { workspace = true }

bs58 = { workspace = true }
# Mandatory, not feature-gated: naclac-syn is the single source of truth for
# discriminator hashing and enum discriminant sequencing (see
# `naclac-syn::discriminator`) — this crate calls those shared functions
# instead of keeping its own independently-drifting copies. naclac-syn has
# no dependency back on this crate, so no cycle.
naclac-syn = { workspace = true }

[features]
debug-mode = []
idl-build = []

[lints]
workspace = true