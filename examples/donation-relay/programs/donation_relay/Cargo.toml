[package]
name = "donation_relay"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", features = ["token"] }

[lints]
workspace = true
