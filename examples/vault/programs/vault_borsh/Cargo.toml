[package]
name = "vault_borsh"
version = "0.1.0"
description = "Created with Naclac Framework"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
idl-build = ["naclac-lang/idl-build"]
default = ["solana", "borsh"]
solana = ["naclac-lang/solana"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs", features = ["litesvm"] }
vault-borsh-client = { version = "0.1.0", path = "../../artifacts/clients/rust/vault_borsh", features = ["borsh"] }

[lints]
workspace = true
