[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
swiv_privacy = "9tm2sLjXouT9SKndmGc4RYp78DtSPq5HjQyCH37oT5Rx"

[framework]
path = "../.."

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test-rust = "cargo test -- --show-output"
test-node = "node_modules/.bin/ts-mocha -p ./tsconfig.json --timeout 1000000 \"tests/**/*.ts\""
