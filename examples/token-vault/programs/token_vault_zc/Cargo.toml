[package]
name = "token_vault_zc"
version = "0.1.0"
description = "Created with Naclac Framework"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", features = ["token"]  }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
token-vault-zc-client = { version = "0.1.0", path = "../../clients/rust/token_vault_zc" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))', 
    'cfg(feature, values("pinocchio", "solana", "borsh"))'
] }
