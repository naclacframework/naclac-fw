[package]
name = "escrow_zc"
version = "0.1.0"
description = "Created with Naclac Framework"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", features = ["token"]  }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
escrow-zc-client = { version = "0.1.0", path = "../../clients/rust/escrow_zc" }

[lints]
workspace = true
