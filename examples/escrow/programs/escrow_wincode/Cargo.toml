[package]
name = "escrow_wincode"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
# Enable to build IDL via real cargo compilation instead of AST parsing:
# idl-build = ["naclac-lang/idl-build"]
default = ["solana", "wincode"]
solana = ["naclac-lang/solana"]
wincode = ["naclac-lang/wincode"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false, features = ["token"] }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs", features = ["litesvm"] }
escrow-wincode-client = { version = "0.1.0", path = "../../artifacts/clients/rust/escrow_wincode" }

[lints]
workspace = true
