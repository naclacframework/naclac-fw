[package]
name = "escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", features = ["token"]  }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
escrow-client = { version = "0.1.0", path = "../../artifacts/clients/rust/escrow" }

[lints]
workspace = true
