[package]
name = "escrow-wincode-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["offchain", "wincode"]
offchain = ["dep:naclac-client"]
cpi = ["dep:naclac-lang"]
solana = ["naclac-lang?/solana"]
pinocchio = ["naclac-lang?/pinocchio"]
bytemuck = ["naclac-lang?/bytemuck"]
borsh = ["naclac-lang?/borsh"]
wincode = ["naclac-lang?/wincode"]

[dependencies]
naclac-client = { version = "0.1.0", optional = true, path = "../../../../../client-rs" }
naclac-lang = { version = "0.1.0", optional = true, default-features = false, path = "../../../../../lang" }
