[package]
name = "amm"
version = "0.1.0"
description = "Created with Naclac Framework"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "borsh"]
solana = ["naclac-lang/solana"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../../lang", default-features = false, features = ["token"]  }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../../client-rs" }
amm-client = { path = "../../artifacts/clients/rust/amm" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))', 
    'cfg(feature, values("pinocchio", "solana", "bytemuck", "borsh", "wincode"))'
] }
