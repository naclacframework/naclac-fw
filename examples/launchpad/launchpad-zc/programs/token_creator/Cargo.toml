[package]
name = "token_creator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "bytemuck"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck", "amm-client/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../../lang", default-features = false, features = ["token"]  }
amm-client = { path = "../../artifacts/clients/rust/amm", default-features = false, features = ["cpi", "solana"] }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../../client-rs", features = ["litesvm"] }
token-creator-client = { version = "0.1.0", path = "../../artifacts/clients/rust/token_creator" }
amm-client = { path = "../../artifacts/clients/rust/amm" }

[lints]
workspace = true
