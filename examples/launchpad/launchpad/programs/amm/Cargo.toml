[package]
name = "amm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
debug-mode = []
idl-build = ["naclac-lang/idl-build"]
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../../lang", features = ["token"] }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../../client-rs", features = ["litesvm"] }
amm-client = { path = "../../artifacts/clients/rust/amm" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))', 
    'cfg(feature, values("pinocchio", "solana", "bytemuck", "borsh", "wincode"))'
] }
