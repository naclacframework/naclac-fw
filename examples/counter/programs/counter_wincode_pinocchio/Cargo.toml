[package]
name = "counter_wincode_pinocchio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
idl-build = ["naclac-lang/idl-build"]
default = ["wincode"]
wincode = ["naclac-lang/wincode"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs", features = ["litesvm"] }
counter-wincode-pinocchio-client = { version = "0.1.0", path = "../../artifacts/clients/rust/counter_wincode_pinocchio" }

[lints]
workspace = true
