[package]
name = "counter_zc"
version = "0.1.0"
description = "Created with Naclac Framework"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
#idl-build = ["naclac-lang/idl-build]
default = ["solana", "bytemuck"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
counter-zc-client = { version = "0.1.0", path = "../../artifacts/clients/rust/counter_zc" }

[lints]
workspace = true
