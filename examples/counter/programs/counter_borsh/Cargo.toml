[package]
name = "counter_borsh"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "borsh"]
solana = ["naclac-lang/solana"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs", features = ["litesvm"] }
counter-borsh-client = { version = "0.1.0", path = "../../artifacts/clients/rust/counter_borsh" }

[lints]
workspace = true
