[package]
name = "pump_fees"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
idl-build = ["naclac-lang/idl-build"]
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck", "pump-client/bytemuck", "pump-amm-client/bytemuck", "donation-relay-client/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../../lang", features = ["token"] }
pump-client = { path = "../../../pump-bonding-curve/artifacts/clients/rust/pump", default-features = false, features = ["cpi", "pinocchio"] }
pump-amm-client = { path = "../../../pump-amm/artifacts/clients/rust/pump_amm", default-features = false, features = ["cpi", "pinocchio"] }
donation-relay-client = { path = "../../../../donation-relay/artifacts/clients/rust/donation_relay", default-features = false, features = ["cpi", "pinocchio"] }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../../client-rs", features = ["litesvm"] }
pump-fees-client = { version = "0.1.0", path = "../../artifacts/clients/rust/pump_fees" }
pump-client = { path = "../../../pump-bonding-curve/artifacts/clients/rust/pump", features = ["offchain"] }
pump-amm-client = { path = "../../../pump-amm/artifacts/clients/rust/pump_amm", features = ["offchain"] }
donation-relay-client = { path = "../../../../donation-relay/artifacts/clients/rust/donation_relay", features = ["offchain"] }

[lints]
workspace = true
