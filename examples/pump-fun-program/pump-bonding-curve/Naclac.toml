[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
pump = "FoN4cWC8wuVYK3Dd2ge1WVTLpPUvj4CcWXZsq4wmadwD"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test-rust = "cargo test -- --show-output"
test-node = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
