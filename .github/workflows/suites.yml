name: Suites

on:
  push:
    branches:
      - main
      - pending
  pull_request:
  workflow_dispatch:

concurrency:
  group: suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: naclac cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p naclac
      - uses: actions/upload-artifact@v7
        with:
          name: naclac-bin
          path: target/release/naclac
          retention-days: 1
          if-no-files-found: error

  suite:
    name: suite (${{ matrix.suite }})
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite:
          - accounts-constraints
          - cpi
          - custom-discriminators
          - discriminator
          - dup-mut
          - enums
          - error-codes
          - event-cpi
          - events
          - fixed-capacity
          - interface
          - metadata
          - optional-accounts
          - pda-seeds
          - realloc
          - representation-routing
          - single-file-layout
          - stack-safety
          - token
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/${{ matrix.suite }}
          shared-key: suite-${{ matrix.suite }}
          save-if: ${{ github.ref_name == 'main' || github.ref_name == 'pending' }}

      - name: Cache Solana toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-v1

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Create throwaway wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          "$HOME/.local/share/solana/install/active_release/bin/solana-keygen" new \
            --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - uses: actions/download-artifact@v8
        with:
          name: naclac-bin
          path: ${{ runner.temp }}/bin

      - name: Put naclac on PATH
        run: |
          chmod +x "${{ runner.temp }}/bin/naclac"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Run suite
        run: bash scripts/test-all.sh ${{ matrix.suite }}

      - name: Disk after run
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: log-${{ matrix.suite }}
          path: test-output-*.log
          retention-days: 7

  client-ts:
    name: typescript client
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm test
        working-directory: client

  compile-fail:
    name: compile-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/compile-fail
          save-if: ${{ github.ref_name == 'main' || github.ref_name == 'pending' }}
      - run: cargo test --locked --test compile_fail
        working-directory: tests/compile-fail

  idl-parity:
    name: idl parity
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/idl-parity/.work
          save-if: ${{ github.ref_name == 'main' || github.ref_name == 'pending' }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: naclac-bin
          path: ${{ runner.temp }}/bin

      - name: Put naclac on PATH
        run: |
          chmod +x "${{ runner.temp }}/bin/naclac"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - run: bash run.sh
        working-directory: tests/idl-parity

  all-green:
    name: all suites green
    if: always()
    needs: [cli, suite, client-ts, compile-fail, idl-parity]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') }}" = "false"
          test "${{ contains(needs.*.result, 'cancelled') }}" = "false"
