name: Suites

on:
  push:
    branches:
      - main
      - pending
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Run only this suite (empty runs everything)
        required: false
        default: ""

concurrency:
  group: suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT: ${{ inputs.suite }}
        run: |
          all='["accounts-constraints","cpi","custom-discriminators","discriminator","dup-mut","enums","error-codes","event-cpi","events","fixed-capacity","interface","metadata","optional-accounts","pda-seeds","realloc","representation-routing","single-file-layout","stack-safety","token"]'
          requested="$INPUT"
          if [ -z "$requested" ]; then
            requested=$(printf '%s' "$MESSAGE" | grep -oE '\[suite: *[a-z, -]+\]' | head -n1 | sed -E 's/\[suite: *([a-z, -]+)\]/\1/' || true)
          fi
          picked=""
          for name in $(printf '%s' "$requested" | tr ',' ' '); do
            if printf '%s' "$all" | grep -q "\"$name\""; then
              picked="${picked:+$picked,}\"$name\""
            fi
          done
          if [ -n "$picked" ]; then
            echo "suites=[$picked]" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "suites=$all" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

  cli:
    name: naclac cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p naclac
      - uses: actions/upload-artifact@v7
        with:
          name: naclac-bin
          path: target/release/naclac
          retention-days: 1
          if-no-files-found: error

  suite:
    name: suite (${{ matrix.suite }})
    needs: [plan, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/${{ matrix.suite }}
          shared-key: suite-${{ matrix.suite }}
          save-if: ${{ github.ref_name == 'main' || github.ref_name == 'pending' }}

      - name: Cache Solana toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-v1

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Create throwaway wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          "$HOME/.local/share/solana/install/active_release/bin/solana-keygen" new \
            --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - uses: actions/download-artifact@v8
        with:
          name: naclac-bin
          path: ${{ runner.temp }}/bin

      - name: Put naclac on PATH
        run: |
          chmod +x "${{ runner.temp }}/bin/naclac"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Run suite
        run: bash scripts/test-all.sh ${{ matrix.suite }}

      - name: Keep the enums TypeScript output for the client tests
        if: matrix.suite == 'enums'
        uses: actions/upload-artifact@v7
        with:
          name: enums-typescript-client
          path: tests/enums/clients/typescript
          retention-days: 1

      - name: Disk after run
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: log-${{ matrix.suite }}
          path: test-output-*.log
          retention-days: 7

  client-ts:
    name: typescript client
    needs: [plan, cli, suite]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: enums-typescript-client
          path: tests/enums/clients/typescript
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm test
        working-directory: client

  compile-fail:
    name: compile-fail
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/compile-fail
          save-if: ${{ github.ref_name == 'main' || github.ref_name == 'pending' }}
      - run: cargo test --locked --test compile_fail
        working-directory: tests/compile-fail

  idl-parity:
    name: idl parity
    needs: [plan, cli]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/idl-parity/.work
          save-if: ${{ github.ref_name == 'main' || github.ref_name == 'pending' }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: naclac-bin
          path: ${{ runner.temp }}/bin

      - name: Put naclac on PATH
        run: |
          chmod +x "${{ runner.temp }}/bin/naclac"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - run: bash run.sh
        working-directory: tests/idl-parity

  all-green:
    name: all suites green
    if: always()
    needs: [cli, suite, client-ts, compile-fail, idl-parity]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') }}" = "false"
          test "${{ contains(needs.*.result, 'cancelled') }}" = "false"
