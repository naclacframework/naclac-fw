name: Release Naclac CLI

# TEMPORARY: build-release/publish-crates/publish-npm removed for a one-off
# litesvm-only publish (client/crates aren't ready to publish yet). This
# lets the trust config already pointing at release.yml work without
# needing a separate trust entry for a throwaway workflow filename. Revert
# this commit right after the litesvm publish succeeds.

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v0.1.0)

permissions:
  contents: write

jobs:
  publish-litesvm-npm:
    name: Publish litesvm npm packages
    uses: ./.github/workflows/publish-litesvm-npm.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      dry_run: false
    secrets: inherit
