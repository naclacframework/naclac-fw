name: Publish Crates

on:
  workflow_call:
    inputs:
      dry_run:
        description: "If true, package crates instead of publishing them (validation only)"
        required: true
        type: boolean

jobs:
  publish-crates-dry-run:
    name: Publish crates (dry-run)
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Package every publishable crate
        run: |
          set -xeuo pipefail
          for crate in naclac-syn naclac-idl naclac-macros naclac-core naclac-token naclac-lang naclac-client-gen naclac-client naclac nacvm; do
            cargo package -p "$crate" --locked
          done

  publish-crates:
    name: Publish crates
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Published in dependency order: leaf crates first, so crates.io always
      # has the version each subsequent crate's `path + version` dependency
      # resolves to. See naclac's workspace Cargo.toml for the dependency graph.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -xeuo pipefail
          for crate in naclac-syn naclac-idl naclac-macros naclac-core naclac-token naclac-lang naclac-client-gen naclac-client naclac nacvm; do
            cargo publish -p "$crate" --locked || echo "::warning::$crate publish failed or already published at this version"
            # crates.io index needs a moment to propagate before the next
            # crate's path+version dependency can resolve against it.
            sleep 20
          done
