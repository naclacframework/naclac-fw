name: Publish litesvm npm packages

on:
  workflow_call:
    inputs:
      dry_run:
        description: "If true, build and stage packages but use --dry-run instead of actually publishing"
        required: true
        type: boolean
  # Lets litesvm publish on its own cadence, independent of release.yml's
  # tag-triggered flow (which also publishes crates and @naclac-fw/client
  # together) — useful since this crate doesn't need to move in lockstep
  # with the rest of the framework.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, build and stage packages but use --dry-run instead of actually publishing"
        required: true
        type: boolean
        default: true

jobs:
  build-litesvm:
    name: Build litesvm addon for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        working-directory: naclac-litesvm-node
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - run: yarn install --frozen-lockfile

      - run: yarn napi build --platform --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: litesvm-bindings-${{ matrix.target }}
          path: naclac-litesvm-node/*.node
          if-no-files-found: error

  publish-litesvm:
    name: Publish litesvm npm packages
    needs: build-litesvm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: release
    env:
      # `actions/setup-node`'s `registry-url` input writes a job-wide
      # `.npmrc` referencing `${NODE_AUTH_TOKEN}` (via NPM_CONFIG_USERCONFIG),
      # regardless of whether the actual publish uses OIDC trusted publishing
      # instead of a token. Yarn's config parser throws on any unresolved
      # `${VAR}` reference, even for commands that never touch the registry,
      # so this must stay defined (empty is fine) for every later yarn
      # invocation in this job to succeed.
      NODE_AUTH_TOKEN: ""
    defaults:
      run:
        working-directory: naclac-litesvm-node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          path: naclac-litesvm-node/artifacts
          pattern: litesvm-bindings-*
          merge-multiple: true

      - run: yarn install --frozen-lockfile

      # A plain project-level .npmrc, not `actions/setup-node`'s
      # `registry-url` input: that mechanism only reliably reaches commands
      # run directly by this workflow, not `napi pre-publish`'s own internal
      # `execSync('npm publish ...')` validation call, which was still
      # falling back to yarn's default registry regardless. A file in the
      # working directory is what every child process here resolves first.
      - run: echo "registry=https://registry.npmjs.org" > .npmrc

      - run: yarn napi create-npm-dirs --npm-dir ./npm

      - run: yarn napi artifacts --output-dir ./artifacts --npm-dir ./npm

      # `--skip-optional-publish`: pre-publish's own internal per-package
      # validation call for each optionalDependencies package (the 4
      # platform packages) runs from a directory our project-level .npmrc
      # doesn't reach and needs real registry auth even for that internal
      # check — our own explicit publish loop below already validates and
      # publishes each of them correctly, so this internal one is redundant.
      - run: yarn napi pre-publish --npm-dir ./npm --no-gh-release --skip-optional-publish

      - name: Publish platform packages (dry-run)
        if: ${{ inputs.dry_run }}
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm publish --dry-run --access public)
          done
          npm publish --dry-run --access public

      - name: Publish platform packages
        if: ${{ !inputs.dry_run }}
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm publish --provenance --access public)
          done
          npm publish --provenance --access public
