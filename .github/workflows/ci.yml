name: CI

on:
  push:
    branches:
      - main
      - pending
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Crates that select a runtime and layout, per combination
        run: |
          set -e
          for combo in solana,bytemuck solana,borsh solana,wincode pinocchio,bytemuck pinocchio,wincode; do
            for pkg in naclac-core naclac-token; do
              cargo clippy -p "$pkg" --no-default-features --features "$combo" --all-targets -- -D warnings
            done
            cargo clippy -p naclac-lang --no-default-features --features "$combo,token,metadata" -- -D warnings
          done
          for runtime in solana pinocchio; do
            cargo clippy -p naclac-metadata --no-default-features --features "$runtime" --all-targets -- -D warnings
          done
      - name: Everything else
        run: >
          cargo clippy --workspace --exclude naclac-core --exclude naclac-lang
          --exclude naclac-token --exclude naclac-metadata --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Crates that select a runtime and layout, per combination
        run: |
          set -e
          for combo in solana,bytemuck solana,borsh solana,wincode pinocchio,bytemuck pinocchio,wincode; do
            cargo test -p naclac-core --locked --no-default-features --features "$combo"
          done
      - name: Everything else
        run: |
          set -e
          cargo build --workspace --exclude naclac-core --exclude naclac-lang --exclude naclac-token --exclude naclac-metadata --locked
          cargo test --workspace --exclude naclac-core --exclude naclac-lang --exclude naclac-token --exclude naclac-metadata --locked
