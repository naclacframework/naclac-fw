[package]
name = "accounts_constraints_zc"
version = "0.1.0"
description = "Regression test: one instruction per #[account(...)] constraint keyword (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
accounts-constraints-zc-client = { version = "0.1.0", path = "../../clients/rust/accounts_constraints_zc" }

[lints]
workspace = true
