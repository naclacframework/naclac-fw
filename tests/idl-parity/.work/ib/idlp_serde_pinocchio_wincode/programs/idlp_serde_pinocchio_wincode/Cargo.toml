[package]
name = "idlp_serde_pinocchio_wincode"
version = "0.1.0"
description = "IDL parity fixture (serde, pinocchio_wincode, ib)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["wincode"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]
borsh = ["naclac-lang/borsh"]
wincode = ["naclac-lang/wincode"]
idl-build = ["naclac-lang/idl-build"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../../../../lang", features = ["token", "metadata"] }

[lints]
workspace = true
