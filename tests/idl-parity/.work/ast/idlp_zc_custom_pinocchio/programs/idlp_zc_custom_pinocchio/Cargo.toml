[package]
name = "idlp_zc_custom_pinocchio"
version = "0.1.0"
description = "IDL parity fixture (zc_custom, pinocchio, ast)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["pinocchio"]
pinocchio = ["naclac-lang/pinocchio"]
borsh = ["naclac-lang/borsh"]
wincode = ["naclac-lang/wincode"]


[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../../../../naclac-lang", default-features = false, features = ["token", "metadata"] }

[lints]
workspace = true
