[package]
name = "custom_disc_borsh"
version = "0.1.0"
description = "Regression test: custom discriminator overrides (solana-borsh backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "borsh"]
solana = ["naclac-lang/solana"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
custom-disc-borsh-client = { version = "0.1.0", path = "../../clients/rust/custom_disc_borsh" }

[lints]
workspace = true
