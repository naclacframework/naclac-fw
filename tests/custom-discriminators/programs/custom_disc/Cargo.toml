[package]
name = "custom_disc"
version = "0.1.0"
description = "Regression test: custom discriminator overrides (pinocchio backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
custom-disc-client = { version = "0.1.0", path = "../../clients/rust/custom_disc" }

[lints]
workspace = true
