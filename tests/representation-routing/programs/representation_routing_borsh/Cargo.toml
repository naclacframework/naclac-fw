[package]
name = "representation_routing_borsh"
version = "0.1.0"
description = "Regression test: the macros route to the representation this crate's own Cargo features select (solana, borsh)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "borsh"]
solana = ["naclac-lang/solana"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
representation-routing-borsh-client = { version = "0.1.0", path = "../../clients/rust/representation_routing_borsh" }

[lints]
workspace = true
