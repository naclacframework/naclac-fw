[package]
name = "representation_routing_zc"
version = "0.1.0"
description = "Regression test: the macros route to the representation this crate's own Cargo features select (solana, bytemuck)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "bytemuck"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
representation-routing-zc-client = { version = "0.1.0", path = "../../clients/rust/representation_routing_zc" }

[lints]
workspace = true
