[package]
name = "representation_routing_zc"
version = "0.1.0"
description = "Regression test: #[component]/#[event]/#[defined_type]/#[instruction_args]/#[derive(Accounts)]/#[program] all route to the representation this crate's own real Cargo features actually select, rather than a proc-macro-side guess (solana zero-copy-default backend — neither pinocchio nor borsh active)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
idl-build = ["naclac-lang/idl-build"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang" }

[lints]
workspace = true
