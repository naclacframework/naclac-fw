[package]
name = "representation_routing"
version = "0.1.0"
description = "Regression test: the macros route to the representation this crate's own Cargo features select (pinocchio, bytemuck)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
representation-routing-client = { version = "0.1.0", path = "../../clients/rust/representation_routing" }

[lints]
workspace = true
