[package]
name = "cpi_caller"
version = "0.1.0"
description = "Regression test: cross-program invocation — system-program CPI, cross-program CPI (unsigned + PDA-signed), mirroring examples/launchpad's token_creator/amm wiring exactly"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck", "cpi-callee-client/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }
cpi-callee-client = { path = "../../clients/rust/cpi_callee", default-features = false, features = ["cpi", "pinocchio"] }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
cpi-caller-client = { version = "0.1.0", path = "../../clients/rust/cpi_caller" }
cpi-callee-client = { path = "../../clients/rust/cpi_callee" }

[lints]
workspace = true
