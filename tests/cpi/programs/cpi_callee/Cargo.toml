[package]
name = "cpi_callee"
version = "0.1.0"
description = "Regression test: cross-program invocation — the program invoked via CPI"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
cpi-callee-client = { version = "0.1.0", path = "../../clients/rust/cpi_callee" }

[lints]
workspace = true
