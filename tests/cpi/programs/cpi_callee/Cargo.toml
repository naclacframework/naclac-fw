[package]
name = "cpi_callee"
version = "0.1.0"
description = "Regression test: cross-program invocation — the program invoked via CPI"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
debug-mode = []
default = ["pinocchio"]
pinocchio = ["naclac-lang/pinocchio"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
cpi-callee-client = { version = "0.1.0", path = "../../clients/rust/cpi_callee" }

[lints]
workspace = true
