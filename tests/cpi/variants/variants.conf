description=Regression test: cross-program invocation
lang_features=

# Each mode builds a callee and a caller; the caller depends on its own mode's callee client.
base.callee=cpi_callee
module.callee=cpi_callee

base.caller=cpi_caller
module.caller=cpi_caller
client.caller=cpi_caller_client
rewrite.caller=s|\bcpi_callee_client\b|cpi_callee%SUFFIX%_client|g
rewrite.caller=s|\bCpiCallee\b|CpiCallee%CAMEL_SUFFIX%|g

# program name | runtime | layout | family
cpi_callee                    | pinocchio | bytemuck | callee
cpi_caller                    | pinocchio | bytemuck | caller
cpi_callee_zc                 | solana    | bytemuck | callee
cpi_caller_zc                 | solana    | bytemuck | caller
cpi_callee_borsh              | solana    | borsh    | callee
cpi_caller_borsh              | solana    | borsh    | caller
cpi_callee_wincode            | solana    | wincode  | callee
cpi_caller_wincode            | solana    | wincode  | caller
cpi_callee_wincode_pinocchio  | pinocchio | wincode  | callee
cpi_caller_wincode_pinocchio  | pinocchio | wincode  | caller
