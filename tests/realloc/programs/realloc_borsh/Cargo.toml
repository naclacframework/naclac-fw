[package]
name = "realloc_borsh"
version = "0.1.0"
description = "Regression test: realloc growing/shrinking, rent top-up/refund, zeroing (solana-borsh)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["borsh"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
realloc-borsh-client = { version = "0.1.0", path = "../../clients/rust/realloc_borsh" }

[lints]
workspace = true
