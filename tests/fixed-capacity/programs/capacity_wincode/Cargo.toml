[package]
name = "capacity_wincode"
version = "0.1.0"
description = "#[max_len] sizing of Vec and String fields in a Wincode account (solana-wincode backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "wincode"]
solana = ["naclac-lang/solana"]
wincode = ["naclac-lang/wincode"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
capacity-wincode-client = { version = "0.1.0", path = "../../clients/rust/capacity_wincode" }

[lints]
workspace = true
