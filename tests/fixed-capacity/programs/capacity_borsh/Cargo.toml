[package]
name = "capacity_borsh"
version = "0.1.0"
description = "#[max_len] sizing of Vec and String fields in a Borsh account (solana-borsh backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["borsh"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
capacity-borsh-client = { version = "0.1.0", path = "../../clients/rust/capacity_borsh" }

[lints]
workspace = true
