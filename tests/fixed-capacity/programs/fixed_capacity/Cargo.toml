[package]
name = "fixed_capacity"
version = "0.1.0"
description = "FixedVec and FixedString fields in a zero-copy account (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "bytemuck"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
fixed-capacity-client = { version = "0.1.0", path = "../../clients/rust/fixed_capacity" }

[lints]
workspace = true
