[package]
name = "discriminator"
version = "0.1.0"
description = "Regression test: discriminator-checked account type confusion (pinocchio backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["bytemuck"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
discriminator-client = { version = "0.1.0", path = "../../clients/rust/discriminator" }

[lints]
workspace = true
