description=Regression test: #[event_cpi] with non-default instruction/event discriminator widths
lang_features=

# Three width families (instruction/event discriminator bytes): w3 = 3/5, w2 = 2/7, w1 = 1/4.
# Each runs in every mode.
client.w3=event_cpi_widths_client
module.w3=event_cpi_widths
client.w2=event_cpi_widths_zc_client
module.w2=event_cpi_widths_zc
client.w1=event_cpi_widths_borsh_client
module.w1=event_cpi_widths_borsh

# program name | runtime | layout | family
event_cpi_w3                    | pinocchio | bytemuck | w3
event_cpi_w3_zc                 | solana    | bytemuck | w3
event_cpi_w3_borsh              | solana    | borsh    | w3
event_cpi_w3_wincode            | solana    | wincode  | w3
event_cpi_w3_wincode_pinocchio  | pinocchio | wincode  | w3
event_cpi_w2                    | pinocchio | bytemuck | w2
event_cpi_w2_zc                 | solana    | bytemuck | w2
event_cpi_w2_borsh              | solana    | borsh    | w2
event_cpi_w2_wincode            | solana    | wincode  | w2
event_cpi_w2_wincode_pinocchio  | pinocchio | wincode  | w2
event_cpi_w1                    | pinocchio | bytemuck | w1
event_cpi_w1_zc                 | solana    | bytemuck | w1
event_cpi_w1_borsh              | solana    | borsh    | w1
event_cpi_w1_wincode            | solana    | wincode  | w1
event_cpi_w1_wincode_pinocchio  | pinocchio | wincode  | w1
