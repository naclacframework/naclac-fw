[package]
name = "event_cpi_widths_zc"
version = "0.1.0"
description = "Regression test: #[event_cpi] with non-default instruction/event discriminator widths (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "bytemuck"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
event-cpi-widths-zc-client = { version = "0.1.0", path = "../../clients/rust/event_cpi_widths_zc" }

[lints]
workspace = true
