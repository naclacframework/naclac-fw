[package]
name = "event_cpi_widths"
version = "0.1.0"
description = "Regression test: #[event_cpi] with non-default instruction/event discriminator widths (pinocchio backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["pinocchio"]
pinocchio = ["naclac-lang/pinocchio"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
event-cpi-widths-client = { version = "0.1.0", path = "../../clients/rust/event_cpi_widths" }

[lints]
workspace = true
