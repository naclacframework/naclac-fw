[package]
name = "dup_mut"
version = "0.1.0"
description = "Regression test: duplicate mutable account aliasing guard (pinocchio backend)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["pinocchio"]
pinocchio = ["naclac-lang/pinocchio"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
dup-mut-client = { version = "0.1.0", path = "../../clients/rust/dup_mut" }

[lints]
workspace = true
