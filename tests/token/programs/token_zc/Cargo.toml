[package]
name = "token_zc"
version = "0.1.0"
description = "Regression test: token::*/mint::* account constraints and real SPL token CPI (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", features = ["token"] }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
token-zc-client = { version = "0.1.0", path = "../../clients/rust/token_zc" }

[lints]
workspace = true
