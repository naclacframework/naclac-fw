[workspace]

[package]
name = "event_cpi_missing_program_id"
version = "0.1.0"
edition = "2021"
publish = false

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { path = "../../../../naclac-lang" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("pinocchio", "solana", "borsh", "wincode"))'
] }
