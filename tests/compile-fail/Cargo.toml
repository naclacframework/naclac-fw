[workspace]

[package]
name = "naclac-compile-fail-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["solana", "bytemuck"]
debug-mode = []
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]
borsh = ["naclac-lang/borsh"]
wincode = ["naclac-lang/wincode"]

[dependencies]
naclac-lang = { path = "../../lang", default-features = false, features = ["token"] }

[dev-dependencies]
trybuild = "1"
