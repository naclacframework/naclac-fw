[package]
name = "enums"
version = "0.1.0"
description = "Enum fields in zero-copy accounts via ZcEnum (pinocchio backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["pinocchio"]
pinocchio = ["naclac-lang/pinocchio"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
enums-client = { version = "0.1.0", path = "../../clients/rust/enums" }

[lints]
workspace = true
