[package]
name = "enums_zc"
version = "0.1.0"
description = "Enum fields in zero-copy accounts via ZcEnum (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
enums-zc-client = { version = "0.1.0", path = "../../clients/rust/enums_zc" }

[lints]
workspace = true
