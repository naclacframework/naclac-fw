[package]
name = "enums_wincode"
version = "0.1.0"
description = "Enum fields in Wincode accounts, instruction args and events (solana-wincode backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["wincode"]
wincode = ["naclac-lang/wincode"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
enums-wincode-client = { version = "0.1.0", path = "../../clients/rust/enums_wincode" }

[lints]
workspace = true
