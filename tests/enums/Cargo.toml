[workspace]
members = ["programs/*", "clients/rust/enums_zc", "clients/rust/enums", "clients/rust/enums_borsh", "clients/rust/enums_wincode"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("pinocchio", "solana", "borsh", "wincode"))'
] }
