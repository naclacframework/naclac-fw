[workspace]
members = ["programs/*", "artifacts/clients/rust/enums_zc", "artifacts/clients/rust/enums", "artifacts/clients/rust/enums_borsh", "artifacts/clients/rust/enums_wincode", "artifacts/clients/rust/enums_wincode_pinocchio"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("pinocchio", "solana", "bytemuck", "borsh", "wincode"))'
] }
