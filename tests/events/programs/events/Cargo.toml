[package]
name = "events"
version = "0.1.0"
description = "Regression test: event emission round-trips correctly in all three backends (pinocchio)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["pinocchio"]
pinocchio = ["naclac-lang/pinocchio"]
idl-build = ["naclac-lang/idl-build"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
events-client = { version = "0.1.0", path = "../../clients/rust/events" }

[lints]
workspace = true
