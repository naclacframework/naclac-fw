[workspace]

[package]
name = "naclac-stack-safety-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Regression test: macros/src/accounts.rs's per-field/aggregate stack-frame size asserts for solana-borsh Accounts-struct fields actually fire, and Box<Account<T>> clears them."

[features]
default = ["solana", "borsh"]
solana = ["naclac-lang/solana"]
borsh = ["naclac-lang/borsh"]

[dependencies]
naclac-lang = { path = "../../../lang", default-features = false }

[dev-dependencies]
trybuild = "1"
