[package]
name = "pda_seeds_zc"
version = "0.1.0"
description = "Regression test: PDA seed-expression classification (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []
default = ["solana", "bytemuck"]
solana = ["naclac-lang/solana"]
bytemuck = ["naclac-lang/bytemuck"]

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../lang", default-features = false }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../client-rs" }
pda-seeds-zc-client = { version = "0.1.0", path = "../../clients/rust/pda_seeds_zc" }

[lints]
workspace = true
