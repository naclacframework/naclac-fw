[package]
name = "pda_seeds_zc"
version = "0.1.0"
description = "Regression test: PDA seed-expression classification (solana-zerocopy backend)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
debug-mode = []

[dependencies]
naclac-lang = { version = "0.1.0", path = "../../../../naclac-lang" }

[dev-dependencies]
naclac-client = { version = "0.1.0", path = "../../../../naclac-client" }
pda-seeds-zc-client = { version = "0.1.0", path = "../../clients/rust/pda_seeds_zc" }

[lints]
workspace = true
