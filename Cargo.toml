[workspace]
members = [
    "cli",
    "naclac-client-gen", 
    "naclac-idl", 
    "naclac-core",
    "naclac-token",
    "naclac-lang",
    "naclac-syn", 
    "naclac-macros", 
    "nacvm",
    "naclac-client"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/naclacframework/naclac-fw"

[workspace.dependencies]
# Internal Workspace Crates
naclac-syn = { version = "0.1.0", path = "naclac-syn" }
naclac-idl = { version = "0.1.0", path = "naclac-idl" }
naclac-client-gen = { version = "0.1.0", path = "naclac-client-gen" }
naclac-macros = { version = "0.1.0", path = "naclac-macros", default-features = false }
naclac-lang = { version = "0.1.0", path = "naclac-lang" }
naclac-core = { version = "0.1.0", path = "naclac-core", default-features = false }
naclac-token = { version = "0.1.0", path = "naclac-token", default-features = false }

# Proc Macros & AST
syn = { version = "2.0.117", features = ["full", "extra-traits", "parsing", "visit", "visit-mut"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
heck = "0.5.0"

# CLI & Utilities
clap = { version = "4.6.0", features = ["derive"] }
indicatif = "0.18.4"
ctrlc = "3.5.2"
dirs = "6.0.0"
colored = "3.1.1"
portable-pty = "0.9.0"

# Codecs & Crypto
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
borsh = { version = "1.6.1", default-features = false, features = ["derive"] }
bs58 = "0.5.1"
base64 = "0.22.1"
flate2 = "1.1.9"
hex = "0.4.3"
toml = "1.1.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
sha2 = "0.11.0"
blake3 = ">=1.0, <1.9"
litesvm = "0.12.0"
thiserror = "2.0.18"

# Solana Web3
solana-program = "^3"
solana-rpc-client = "^3"
solana-rpc-client-api = "^3"
solana-transaction-status = "^3"
solana-account = "^3"
solana-message = "^3"
solana-commitment-config = "^3"
solana-keypair = "^3"
solana-transaction = "^3"
solana-instruction = "^3"
solana-signature = "^3"
solana-account-decoder = "^3"
solana-address = { version = "^2", features = ["curve25519"] }
solana-system-interface = { version = "^3", features = ["wincode"] }
solana-signer = "^3"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

#pinocchio
pinocchio = { version = "^0.11", features = [ "cpi", "alloc", "copy" ] }
pinocchio-system = { version = "^0.6" }
pinocchio-token = { version = "^0.6" }
pinocchio-token-2022 = { version = "^0.3" }
pinocchio-log = { version = "^0.5" }
pinocchio-pubkey = { version = "^0.3" }
pinocchio-log-macro = { version = "^0.5" }
pinocchio-associated-token-account = { version = "^0.4" }
pinocchio-memo = { version = "^0.4" }