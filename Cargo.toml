[workspace]
members = [
    "cli",
    "client-gen",
    "idl",
    "core",
    "pod",
    "token",
    "metadata",
    "lang",
    "syn",
    "macros",
    "nacvm",
    "client-rs",
    "litesvm-node"
]
exclude = ["litesvm"]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_feature, values("static-syscalls"))',
    'cfg(kani)',
] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/naclacframework/naclac-fw"

[workspace.dependencies]
# Internal Workspace Crates
naclac-syn = { version = "0.1.0", path = "syn" }
naclac-idl = { version = "0.1.0", path = "idl" }
naclac-client-gen = { version = "0.1.0", path = "client-gen" }
naclac-macros = { version = "0.1.0", path = "macros", default-features = false }
naclac-core = { version = "0.1.0", path = "core", default-features = false }
naclac-pod = { version = "0.1.0", path = "pod", default-features = false }
naclac-token = { version = "0.1.0", path = "token", default-features = false }
naclac-metadata = { version = "0.1.0", path = "metadata", default-features = false }
naclac-client = { version = "0.1.0", path = "client-rs" }

# Proc Macros & AST
syn = { version = "3.0.3", features = ["full", "extra-traits", "parsing", "visit", "visit-mut"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
prettyplease = "0.3.0"
heck = "0.5.0"

# CLI & Utilities
clap = { version = "4.6.0", features = ["derive"] }
indicatif = "0.18.4"
ctrlc = "3.5.2"
dirs = "6.0.0"
colored = "3.1.1"

# Codecs & Crypto
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
borsh = { version = "1.6.1", default-features = false, features = ["derive"] }
bs58 = "0.5.1"
base64 = "0.22.1"
flate2 = "1.1.9"
hex = "0.4.3"
toml = "1.1.1"
wincode = "0.6.1"
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
sha2 = "0.11.0"
litesvm = { path = "litesvm/crates/litesvm" }
thiserror = "2.0.18"
five8 = { version = "1.0.0", default-features = false }

#solana
solana-rpc-client = "^4.3"
solana-account-info = "^3"
solana-cpi = "^3"
solana-msg = { version = "^3", default-features = false, features = ["alloc"] }
solana-program-error = "^3"
solana-program-entrypoint = "^3"
solana-rent = "^4"
solana-clock = "^3"
solana-sysvar = "^4"
solana-get-sysvar = "^1"
solana-program-pack = "^3"
solana-sha256-hasher = "^3"
solana-rpc-client-api = "^4.3"
solana-transaction-status = "^4.3"
solana-transaction-status-client-types = "^4.3"
solana-account = "^4"
solana-message = "^4"
solana-commitment-config = "^3"
solana-keypair = "^3"
solana-transaction = "^4"
solana-instruction = "^3"
solana-instruction-error = "^2"
solana-hash = "^4"
solana-signature = "^3"
solana-account-decoder = "^4.3"
solana-account-decoder-client-types = "^4.3"
solana-address ={ version = "^2", features = ["curve25519"] }
solana-system-interface = { version = "^3", features = ["wincode"] }
solana-signer = "^3"
solana-sdk-ids = "^3"
solana-loader-v3-interface = "^9"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = { version = "2.1.0" }
spl-token-metadata-interface = { version = "1.0.1" }
spl-token-group-interface = { version = "0.7.2" }
spl-discriminator = { version = "0.5.2" }
solana-nullable = { version = "1.3.0" }
solana-define-syscall = "^5"

#pinocchio
pinocchio = { version = "^0.11", features = [ "cpi", "alloc", "copy", "account-resize" ] }
pinocchio-system = { version = "^0.6" }
pinocchio-token = { version = "^0.6" }
pinocchio-token-2022 = { version = "^0.3" }
pinocchio-log = { version = "^0.5" }
pinocchio-pubkey = { version = "^0.3" }
pinocchio-log-macro = { version = "^0.5" }
pinocchio-associated-token-account = { version = "^0.4" }
pinocchio-memo = { version = "^0.4" }