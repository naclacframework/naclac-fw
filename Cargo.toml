[workspace]
members = [
    "cli",
    "naclac-client-gen", 
    "naclac-idl", 
    "naclac-core",
    "naclac-token",
    "naclac-metadata",
    "naclac-lang",
    "naclac-syn", 
    "naclac-macros", 
    "nacvm",
    "naclac-client"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/naclacframework/naclac-fw"

[workspace.dependencies]
# Internal Workspace Crates
naclac-syn = { version = "0.1.0", path = "naclac-syn" }
naclac-idl = { version = "0.1.0", path = "naclac-idl" }
naclac-client-gen = { version = "0.1.0", path = "naclac-client-gen" }
naclac-macros = { version = "0.1.0", path = "naclac-macros", default-features = false }
naclac-lang = { version = "0.1.0", path = "naclac-lang" }
naclac-core = { version = "0.1.0", path = "naclac-core", default-features = false }
naclac-token = { version = "0.1.0", path = "naclac-token", default-features = false }
naclac-metadata = { version = "0.1.0", path = "naclac-metadata", default-features = false }

# Proc Macros & AST
syn = { version = "3.0.3", features = ["full", "extra-traits", "parsing", "visit", "visit-mut"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
heck = "0.5.0"

# CLI & Utilities
clap = { version = "4.6.0", features = ["derive"] }
indicatif = "0.18.4"
ctrlc = "3.5.2"
dirs = "6.0.0"
colored = "3.1.1"

# Codecs & Crypto
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
borsh = { version = "1.6.1", default-features = false, features = ["derive"] }
bs58 = "0.5.1"
base64 = "0.22.1"
flate2 = "1.1.9"
hex = "0.4.3"
toml = "1.1.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
sha2 = "0.11.0"
blake3 = ">=1.0, <1.9"
litesvm = "0.15.2"
solana-transaction-context = "=4.1.1"
thiserror = "2.0.18"
five8 = { version = "1.0.0", default-features = false }

solana-program = "^3"
solana-rpc-client = "=4.1.1"
solana-rpc-client-api = "=4.1.1"
solana-transaction-status = "=4.1.1"
solana-account = "=4.3.2"
solana-message = "=4.4.1"
solana-commitment-config = "=3.1.1"
solana-keypair = "=3.1.2"
solana-transaction = "=4.1.6"
solana-instruction = "^3"
solana-signature = "=3.4.1"
solana-account-decoder = "=4.1.1"
solana-address = { version = "^2", features = ["curve25519"] }
solana-system-interface = { version = "^3", features = ["wincode"] }
solana-signer = "=3.0.1"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = { version = "2.1.0" }
spl-token-metadata-interface = { version = "1.0.1" }
spl-token-group-interface = { version = "0.7.2" }
solana-nullable = { version = "1.2.0" }
mpl-core = { version = "0.12.1" }

#pinocchio
pinocchio = { version = "^0.11", features = [ "cpi", "alloc", "copy", "account-resize" ] }
pinocchio-system = { version = "^0.6" }
pinocchio-token = { version = "^0.6" }
pinocchio-token-2022 = { version = "^0.3" }
pinocchio-log = { version = "^0.5" }
pinocchio-pubkey = { version = "^0.3" }
pinocchio-log-macro = { version = "^0.5" }
pinocchio-associated-token-account = { version = "^0.4" }
pinocchio-memo = { version = "^0.4" }