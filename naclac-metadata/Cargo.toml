[package]
name = "naclac-metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metaplex Core (NFT/metadata) support for the Naclac Solana Framework."

[dependencies]
naclac-core = { workspace = true }
solana-program = { workspace = true, optional = true }
pinocchio = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[features]
default = ["solana"]
solana = ["dep:solana-program", "naclac-core/solana"]
pinocchio = ["dep:pinocchio", "naclac-core/pinocchio", "dep:bytemuck"]

[lints]
workspace = true
