[package]
name = "naclac"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The command-line interface for the Naclac Solana Framework."

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
heck = { workspace = true }
sha2 = { workspace = true }
naclac-idl = { workspace = true }
naclac-client-gen = { workspace = true }

solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-rpc-client = { workspace = true }
solana-keypair = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-system-interface = { workspace = true, features = ["wincode"] }
solana-signer = { workspace = true }
flate2 = { workspace = true }
bs58 = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
dialoguer = "0.12.0"

[lints]
workspace = true
