[package]
name = "naclac-client-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TypeScript client and SDK generator for Naclac programs."

[dependencies]
naclac-idl = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
heck = { workspace = true }
bs58 = { workspace = true }
# Only needed to generate the zero-copy `CheckedBitPattern` machinery for a
# data-carrying enum client-side (see `rust/pod_codegen/checked_enum.rs`) —
# this crate otherwise generates client code as plain template strings, not
# `syn`/`quote` ASTs.
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
prettyplease = { workspace = true }
