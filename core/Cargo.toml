[package]
name = "naclac-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The core Rust framework for writing hyper-optimized Solana smart contracts."

[dependencies]
solana-account-info = { workspace = true, optional = true }
solana-msg = { workspace = true, optional = true }
solana-program-error = { workspace = true, optional = true }
solana-rent = { workspace = true, optional = true, features = ["sysvar"] }
solana-clock = { workspace = true, optional = true, features = ["sysvar"] }
solana-get-sysvar = { workspace = true, optional = true }
solana-sha256-hasher = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
naclac-pod = { workspace = true, features = ["alloc"], optional = true }
naclac-idl = { workspace = true, optional = true }
naclac-derive = { workspace = true }
borsh = { workspace = true, features = ["derive"], optional = true }
wincode = { version = "0.6.1", default-features = false, features = ["derive", "alloc"], optional = true }
wincode-derive = { version = "0.5.1", optional = true }
solana-system-interface = { version = "^3", default-features = false, optional = true }
pinocchio = { workspace = true, optional = true }
pinocchio-system = { workspace = true, optional = true }
pinocchio-log = { workspace = true, optional = true }
pinocchio-log-macro = { workspace = true, optional = true }
solana-address = { workspace = true, optional = true }
five8 = { workspace = true }
const-crypto = { workspace = true }
solana-define-syscall = { workspace = true, optional = true }

[features]
solana = [
    "naclac-pod?/solana", 
    "dep:solana-account-info", 
    "dep:solana-msg", 
    "dep:solana-program-error", 
    "dep:solana-rent", 
    "dep:solana-clock", 
    "dep:solana-get-sysvar", 
    "dep:solana-sha256-hasher", 
    "dep:solana-instruction", 
    "dep:solana-system-interface", 
    "dep:solana-address", 
    "dep:solana-define-syscall"
]
bytemuck = [
    "dep:bytemuck", 
    "dep:naclac-pod", 
    "solana-address?/bytemuck"
]
borsh = [
    "dep:borsh", 
    "solana-address?/borsh"
]
wincode = [
    "dep:wincode",
    "dep:wincode-derive",
    "solana-address?/wincode"
]
pinocchio = [
    "naclac-pod?/pinocchio",
    "dep:pinocchio",
    "dep:pinocchio-system",
    "dep:pinocchio-log",
    "dep:pinocchio-log-macro",
    "dep:solana-define-syscall",
]
debug-mode = ["naclac-derive/debug-mode"]
idl-build = ["dep:naclac-idl", "naclac-pod?/idl-build"]

[dev-dependencies]
solana-stable-layout = "=3.0.1"
solana-program-entrypoint = { workspace = true }
solana-cpi = { workspace = true }

[lints]
workspace = true